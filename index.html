<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c01f6b">
<meta name="description" content="Virtual practical lab for B.Pharm Physical Pharmaceutics I (BP306P)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Virtual Lab">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Virtual Pharmacy Lab build 2026-10-25 (with PDF download) -->
<title>Virtual Pharmacy Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout concept: a lab-manual index. The hub reads like the manual's own index table
   (Sr.No / experiment / topic); each experiment is a bench with tabs.
   Accent is phenolphthalein pink, the colour every student is waiting to see at an end point. */
:root {
  --bg: #f1f5f6;
  --surface: #ffffff;
  --surface-2: #e8eff1;
  --ink: #12262e;
  --muted: #55696f;
  --line: #d3dee1;
  --accent: #c01f6b;
  --accent-ink: #ffffff;
  --accent-soft: #fbe3ee;
  --teal: #0e6b70;
  --teal-soft: #d9eeef;
  --good: #1b7f55;
  --good-soft: #dcf2e7;
  --warn: #9a6200;
  --warn-soft: #fbefd2;
  --bad: #b3261e;
  --bad-soft: #fbe0dd;
  --glass: #9fb6bd;
  --liquid: #7cc4c8;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b181e; --surface: #12262f; --surface-2: #19323d; --ink: #e5eff1; --muted: #8ea8b0;
    --line: #25434f; --accent: #ff63a5; --accent-ink: #20060f; --accent-soft: #3a1a2a;
    --teal: #55c4c9; --teal-soft: #14363b; --good: #4ad196; --good-soft: #123a2a;
    --warn: #e8b04a; --warn-soft: #3a2d10; --bad: #ff8b82; --bad-soft: #3d1b19;
    --glass: #4f6c76; --liquid: #3f9ea3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b181e; --surface: #12262f; --surface-2: #19323d; --ink: #e5eff1; --muted: #8ea8b0;
  --line: #25434f; --accent: #ff63a5; --accent-ink: #20060f; --accent-soft: #3a1a2a;
  --teal: #55c4c9; --teal-soft: #14363b; --good: #4ad196; --good-soft: #123a2a;
  --warn: #e8b04a; --warn-soft: #3a2d10; --bad: #ff8b82; --bad-soft: #3d1b19;
  --glass: #4f6c76; --liquid: #3f9ea3; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0 0 .7em; max-width: 68ch; }
a { color: var(--teal); }
small, .muted { color: var(--muted); }
.mono, td.num, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.bar .brand { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; flex: 1 1 auto; min-width: 0; }
.bar .brand span { color: var(--muted); font-weight: 500; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 4px 10px; min-height: 32px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* hub */
.hero { padding: 28px 0 18px; display: grid; gap: 10px; }
.hero .code { font-family: var(--f-mono); font-size: .85rem; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.hero p { color: var(--muted); }
.student { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 6px 0 22px; }
.student label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 160px; min-width: 0; }
.student input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
.index { border-top: 2px solid var(--ink); }
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; cursor: pointer; }
.row:hover { background: var(--surface); }
.row .no { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 600; color: var(--teal); }
.row .ttl { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
.row .sub { color: var(--muted); font-size: .92rem; }
.row .go { color: var(--accent); font-weight: 600; white-space: nowrap; }
.chip { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--teal-soft); color: var(--teal); margin-right: 6px; }
.chip.done { background: var(--good-soft); color: var(--good); }
@media (max-width: 560px) { .row { grid-template-columns: 40px minmax(0, 1fr); } .row .go { grid-column: 2; } }

/* experiment shell */
.exp-head { padding: 18px 0 10px; display: grid; gap: 6px; }
.crumb { font-size: .9rem; }
.aim { color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tab { appearance: none; border: 0; background: none; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding: 20px 0; display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card > h3 { margin-bottom: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
ul.plain { margin: 0; padding-left: 1.1em; } ul.plain li { margin: 2px 0; }
ol.steps { margin: 0; padding-left: 1.3em; } ol.steps li { margin: 6px 0; }
.eq { font-family: var(--f-mono); background: var(--surface-2); padding: 8px 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-size: .92rem; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); font-size: .92rem; }
.tip { padding: 10px 12px; border-radius: 8px; background: var(--teal-soft); border-left: 4px solid var(--teal); font-size: .92rem; }
.ok { color: var(--good); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; } .warn { color: var(--warn); font-weight: 600; }

/* tables */
.tw { overflow-x: auto; }
table.obs { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.obs th, table.obs td { border: 1px solid var(--line); padding: 6px 8px; text-align: right; white-space: nowrap; }
table.obs th { background: var(--surface-2); font-weight: 600; text-align: center; }
table.obs td:first-child, table.obs th:first-child { text-align: left; }
table.obs tr.hl td { background: var(--accent-soft); }

/* bench widgets */
.bench { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.stepper { display: grid; gap: 8px; }
.step { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.step.done { border-color: var(--good); background: var(--good-soft); }
.step .t { flex: 1 1 200px; min-width: 0; }
.row-inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row-inputs label { display: grid; gap: 3px; font-size: .8rem; color: var(--muted); }
.row-inputs input, .row-inputs select, .inp { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; max-width: 160px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg .btn[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
.burette { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 420px) { .burette { grid-template-columns: 1fr; } }
.readout { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 600; }
.readout small { font-size: .75rem; font-weight: 400; }
.msg { min-height: 1.4em; font-size: .92rem; }
svg { max-width: 100%; height: auto; }
svg text { font-family: var(--f-body); fill: var(--muted); font-size: 11px; }
svg .ax { stroke: var(--muted); stroke-width: 1; fill: none; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .lbl { fill: var(--ink); font-size: 12px; }
.chart { width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.checkrow { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: end; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; }
.checkrow label { display: grid; gap: 3px; font-size: .85rem; flex: 1 1 200px; min-width: 0; }

/* viva */
details.q { border-bottom: 1px solid var(--line); padding: 8px 0; }
details.q summary { cursor: pointer; font-weight: 600; }
details.q div { padding: 6px 0 0 1.1em; color: var(--muted); }

/* report */
.paper { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 4px; padding: clamp(14px, 4vw, 32px); font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
.paper h2 { font-family: Georgia, serif; text-align: center; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .04em; }
.paper h3 { font-family: Georgia, serif; font-size: 1rem; margin: 14px 0 4px; text-decoration: underline; }
.paper table.obs th { background: #eee; color: #111; } .paper table.obs th, .paper table.obs td { border-color: #888; }
.paper .meta { display: flex; flex-wrap: wrap; gap: 4px 24px; justify-content: space-between; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 10px; font-size: .95rem; }
.paper svg text { fill: #333; } .paper .eq { background: #f1f1f1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; max-width: 90vw; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.drop { animation: fall .5s ease-in; } @keyframes fall { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.liquid { transition: all .35s ease; }
.btn { text-decoration: none; display: inline-block; color: var(--ink); }
.btn.primary { color: var(--accent-ink); }
.seg .btn[aria-pressed="true"] { color: #fff; }
.burette > svg { max-width: 200px; justify-self: center; }
@media (max-width: 520px) { .burette { grid-template-columns: 1fr !important; } }
.credit { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 12px 14px; margin: 4px 0 12px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font-size: .95rem; }
.credit .lbl { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.paper .ptitle { text-align: center; font-weight: bold; font-size: 1.05rem; }

</style>
</head>
<body>

<div id="app"></div>
<script>
/* ===== Virtual Lab core: helpers, graph, fitting ===== */
const VL = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s, r) => (r || document).querySelector(s);
  function h(tag, attrs, ...kids) {
    const svg = ['svg','g','path','line','rect','circle','text','polyline','polygon','defs','clipPath','ellipse'].includes(tag);
    const e = svg ? document.createElementNS(NS, tag) : document.createElement(tag);
    for (const k in (attrs || {})) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.setAttribute('class', v);
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(9).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }
  const fmt = (x, d = 2) => (x === null || x === undefined || !isFinite(x)) ? '–' : Number(x).toFixed(d);
  const sig = (x, n = 3) => (x === null || !isFinite(x)) ? '–' : Number(x).toPrecision(n);
  function hash(str) { let a = 2166136261; for (let i = 0; i < str.length; i++) { a ^= str.charCodeAt(i); a = Math.imul(a, 16777619); } return a >>> 0; }
  function mulberry(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  const store = {
    get(k, d) { try { const v = localStorage.getItem('vl:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('vl:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  function toast(msg) {
    const t = h('div', { class: 'toast', role: 'status' }, msg);
    document.body.append(t); setTimeout(() => t.remove(), 2200);
  }
  async function copyText(text, node) {
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch (e) {
      if (node) { const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast('Select and copy the text');
    }
  }
  function linfit(pts) {
    const n = pts.length; if (n < 2) return { m: NaN, c: NaN, r2: NaN };
    let sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
    pts.forEach(([x, y]) => { sx += x; sy += y; sxx += x * x; sxy += x * y; syy += y * y; });
    const d = n * sxx - sx * sx; if (!d) return { m: NaN, c: NaN, r2: NaN };
    const m = (n * sxy - sx * sy) / d, c = (sy - m * sx) / n;
    const ssr = pts.reduce((a, [x, y]) => a + (y - (m * x + c)) ** 2, 0);
    const sst = syy - sy * sy / n;
    return { m, c, r2: sst ? 1 - ssr / sst : 1 };
  }
  function bisect(f, lo, hi, it = 80) { let flo = f(lo); for (let i = 0; i < it; i++) { const mid = (lo + hi) / 2, fm = f(mid); if ((fm > 0) === (flo > 0)) { lo = mid; flo = fm; } else hi = mid; } return (lo + hi) / 2; }
  function nice(min, max, n = 6) {
    if (min === max) { max = min + 1; }
    const span = max - min, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
    for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toPrecision(10));
    return { lo, hi, ticks: t };
  }
  const COLORS = ['var(--accent)', 'var(--teal)', 'var(--warn)', 'var(--good)'];

  /* Scatter / line chart drawn to one scale.
     opts: {xlabel, ylabel, series:[{name, pts, line, color, dashed}], lines:[{pts, color, dashed, name}], marks:[{x,y,label}], xmin,xmax,ymin,ymax, w,h} */
  function graph(root, opts) {
    const W = opts.w || 560, H = opts.h || 340, m = { l: 58, r: 18, t: 16, b: 48 };
    const all = [];
    (opts.series || []).forEach(s => s.pts.forEach(p => all.push(p)));
    (opts.lines || []).forEach(s => s.pts.forEach(p => all.push(p)));
    (opts.marks || []).forEach(k => all.push([k.x, k.y]));
    const xs = all.map(p => p[0]).filter(isFinite), ys = all.map(p => p[1]).filter(isFinite);
    if (!xs.length) { root.replaceChildren(h('p', { class: 'muted' }, 'The graph appears here once you record readings.')); return; }
    const X = nice(opts.xmin ?? Math.min(...xs), opts.xmax ?? Math.max(...xs)), Y = nice(opts.ymin ?? Math.min(...ys), opts.ymax ?? Math.max(...ys));
    const sx = v => m.l + (v - X.lo) / (X.hi - X.lo) * (W - m.l - m.r), sy = v => H - m.b - (v - Y.lo) / (Y.hi - Y.lo) * (H - m.t - m.b);
    const svg = h('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': opts.title || 'graph' });
    const dp = t => Math.abs(t) >= 100 || t === 0 ? 0 : Math.abs(t) >= 10 ? 1 : Math.abs(t) >= 1 ? 2 : 3;
    Y.ticks.forEach(t => { svg.append(h('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: sy(t), y2: sy(t) }), h('text', { x: m.l - 6, y: sy(t) + 4, 'text-anchor': 'end' }, +t.toPrecision(4))); });
    X.ticks.forEach(t => { svg.append(h('line', { class: 'grid', y1: m.t, y2: H - m.b, x1: sx(t), x2: sx(t) }), h('text', { x: sx(t), y: H - m.b + 16, 'text-anchor': 'middle' }, +t.toPrecision(4))); });
    svg.append(h('line', { class: 'ax', x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }), h('line', { class: 'ax', x1: m.l, x2: m.l, y1: m.t, y2: H - m.b }));
    svg.append(h('text', { class: 'lbl', x: (m.l + W - m.r) / 2, y: H - 8, 'text-anchor': 'middle' }, opts.xlabel || ''));
    svg.append(h('text', { class: 'lbl', transform: `translate(14 ${(m.t + H - m.b) / 2}) rotate(-90)`, 'text-anchor': 'middle' }, opts.ylabel || ''));
    (opts.lines || []).forEach((l, i) => svg.append(h('polyline', { points: l.pts.map(p => `${sx(p[0])},${sy(p[1])}`).join(' '), fill: 'none', style: `stroke:${l.color || 'var(--muted)'};stroke-width:1.8`, 'stroke-dasharray': l.dashed ? '6 4' : null })));
    (opts.series || []).forEach((s, i) => {
      const c = s.color || COLORS[i % COLORS.length];
      if (s.line && s.pts.length > 1) svg.append(h('polyline', { points: s.pts.map(p => `${sx(p[0])},${sy(p[1])}`).join(' '), fill: 'none', style: `stroke:${c};stroke-width:2` }));
      s.pts.forEach(p => svg.append(h('circle', { cx: sx(p[0]), cy: sy(p[1]), r: s.r || 4, style: `fill:${c};stroke:var(--surface);stroke-width:1.5` })));
    });
    (opts.marks || []).forEach(k => {
      svg.append(h('circle', { cx: sx(k.x), cy: sy(k.y), r: 6, fill: 'none', style: 'stroke:var(--ink);stroke-width:2' }));
      if (k.label) svg.append(h('text', { class: 'lbl', x: Math.min(sx(k.x) + 9, W - 120), y: Math.max(sy(k.y) - 9, 14) }, k.label));
    });
    const legend = h('div', { class: 'legend' }, [...(opts.series || []), ...(opts.lines || [])].filter(s => s.name).map((s, i) => h('span', {}, h('i', { style: { background: s.color || COLORS[i % COLORS.length] } }), s.name)));
    root.replaceChildren(svg, legend);
  }

  return { $, h, fmt, sig, hash, mulberry, gauss, store, toast, copyText, linfit, bisect, nice, graph, COLORS, experiments: [], register(e) { this.experiments.push(e); } };
})();

/* ===== Virtual Lab core: burette, pH meter, tables, checks, viva ===== */
(() => {
  const { h, fmt } = VL;

  /* Burette + flask. o: {title, onRecord(vol), max=50, tol=0.5}
     setup({end, titrant, sample, indicator:{from,to,name,mode:'appear'|'vanish'}}) arms a new titration. */
  VL.titration = function (root, o) {
    const max = o.max || 50, tol = o.tol ?? 0.5;
    let vol = 0, end = null, ind = null, recorded = false;
    const PX = 4.6, TOP = 10;
    const liq = h('rect', { x: 88, width: 24, class: 'liquid', style: 'fill:var(--liquid)' });
    const flaskFrom = h('path', { d: 'M92 285 L92 305 L72 338 L128 338 L108 305 L108 285 Z', style: 'fill:var(--liquid);opacity:.35' });
    const flaskTo = h('path', { d: 'M92 285 L92 305 L72 338 L128 338 L108 305 L108 285 Z', style: 'opacity:0', class: 'liquid' });
    const drop = h('circle', { cx: 100, cy: 270, r: 3, style: 'fill:var(--liquid);opacity:0' });
    const svg = h('svg', { viewBox: '0 0 200 350', role: 'img', 'aria-label': 'Burette and conical flask' });
    svg.append(h('rect', { x: 88, y: TOP, width: 24, height: 50 * PX, rx: 2, fill: 'none', style: 'stroke:var(--glass);stroke-width:2' }), liq);
    for (let ml = 0; ml <= 50; ml++) {
      const y = TOP + ml * PX, major = ml % 5 === 0;
      svg.append(h('line', { x1: major ? 76 : 82, x2: 88, y1: y, y2: y, style: 'stroke:var(--muted);stroke-width:1' }));
      if (major) svg.append(h('text', { x: 72, y: y + 4, 'text-anchor': 'end' }, ml));
    }
    svg.append(h('rect', { x: 95, y: TOP + 50 * PX + 2, width: 10, height: 14, style: 'fill:var(--glass)' }), h('line', { x1: 100, x2: 100, y1: TOP + 50 * PX + 16, y2: 268, style: 'stroke:var(--glass);stroke-width:2' }), drop, flaskFrom, flaskTo,
      h('path', { d: 'M92 285 L92 305 L72 338 L128 338 L108 305 L108 285', fill: 'none', style: 'stroke:var(--glass);stroke-width:2' }));
    const read = h('div', { class: 'readout' }, '0.00', h('small', {}, ' ml'));
    const msg = h('div', { class: 'msg', 'aria-live': 'polite' });
    const info = h('div', { class: 'muted' });
    const mk = (label, dv) => h('button', { class: 'btn', onclick: () => add(dv) }, label);
    const recBtn = h('button', { class: 'btn primary', onclick: record }, 'Record end point');
    const resetBtn = h('button', { class: 'btn', onclick: () => reset(true) }, 'Refill burette');
    const card = h('div', { class: 'card' }, h('h3', {}, o.title || 'Titration'), info,
      h('div', { class: 'burette' }, svg, h('div', { style: { display: 'grid', gap: '10px' } }, read, h('div', { class: 'seg' }, mk('+5', 5), mk('+1', 1), mk('+0.1', 0.1), mk('1 drop', 0.05)), h('div', { class: 'seg' }, recBtn, resetBtn), msg)));
    root.append(card);
    function paint() {
      const y = TOP + Math.min(vol, 50) * PX;
      liq.setAttribute('y', y); liq.setAttribute('height', 50 * PX - Math.min(vol, 50) * PX);
      read.firstChild.nodeValue = fmt(vol, 2);
      if (!ind) { flaskTo.style.opacity = 0; return; }
      const t = Math.max(0, Math.min(1, (vol - (end - 0.15)) / 0.15));
      const extra = vol > end ? Math.min(0.35, (vol - end) * 0.25) : 0;
      if (ind.mode === 'vanish') { flaskFrom.style.fill = ind.from; flaskFrom.style.opacity = 0.95; flaskTo.style.fill = ind.to; flaskTo.style.opacity = t * 0.95; }
      else { flaskFrom.style.fill = ind.from; flaskFrom.style.opacity = 0.35; flaskTo.style.fill = ind.to; flaskTo.style.opacity = t ? Math.min(1, 0.55 + extra + t * 0.1) : 0; }
    }
    function add(dv) {
      if (!ind) { msg.className = 'msg warn'; msg.textContent = 'Prepare the sample in the flask first.'; return; }
      if (recorded) { msg.className = 'msg warn'; msg.textContent = 'Already recorded. Refill the burette to repeat.'; return; }
      if (vol + dv > max + 1e-9) { msg.className = 'msg warn'; msg.textContent = 'The burette is empty. Refill and start again.'; return; }
      vol = Math.round((vol + dv) * 100) / 100; msg.textContent = '';
      drop.style.opacity = 1; drop.classList.remove('drop'); void drop.getBoundingClientRect(); drop.classList.add('drop'); setTimeout(() => drop.style.opacity = 0, 500);
      paint();
    }
    function record() {
      if (!ind) { msg.className = 'msg warn'; msg.textContent = 'Prepare the sample in the flask first.'; return; }
      if (recorded) return;
      if (vol < end - 0.001) { msg.className = 'msg warn'; msg.textContent = 'The colour has not changed yet, so the end point is not reached. Keep adding titrant.'; return; }
      const over = vol - end;
      if (over > tol) { msg.className = 'msg bad'; msg.textContent = `Overshot by about ${fmt(over, 1)} ml. Refill the burette and repeat with drops near the end.`; return; }
      recorded = true; msg.className = 'msg ok';
      msg.textContent = over < 0.1 ? `Recorded ${fmt(vol, 2)} ml. Sharp end point.` : `Recorded ${fmt(vol, 2)} ml. Slight overshoot; use single drops near the end next time.`;
      o.onRecord && o.onRecord(vol);
    }
    function reset(keepSample) {
      vol = 0; recorded = false; msg.textContent = '';
      if (!keepSample) { ind = null; end = null; info.textContent = 'Flask is empty.'; }
      paint();
    }
    function setup(s) {
      end = s.end; ind = Object.assign({ from: 'var(--liquid)', to: '#e0328f', mode: 'appear' }, s.indicator || {});
      info.innerHTML = `Burette: <b>${s.titrant}</b>. Flask: ${s.sample}. End point: ${ind.name || 'colour change'}.`;
      reset(true);
    }
    reset(false);
    return { setup, reset: () => reset(false), el: card, get armed() { return !!ind; } };
  };

  /* pH meter. o:{offset} offset (pH units) applies until two-point calibration is done. */
  VL.phmeter = function (root, o) {
    const cal = new Set(); let calibrated = false;
    const disp = h('div', { class: 'readout', style: { fontSize: '2rem' } }, '–.––');
    const st = h('div', { class: 'msg warn' }, 'Not calibrated. Calibrate with at least two buffers before measuring.');
    const mkb = (ph) => h('button', { class: 'btn', onclick: () => { cal.add(ph); calibrated = cal.size >= 2; st.className = 'msg ' + (calibrated ? 'ok' : 'warn'); st.textContent = calibrated ? 'Calibrated. Readings are reliable.' : `Buffer pH ${ph} done. One more buffer needed.`; } }, `Buffer pH ${ph}`);
    root.append(h('div', { class: 'card' }, h('h3', {}, 'pH meter'), disp, h('div', { class: 'seg' }, mkb('4.00'), mkb('7.00'), mkb('9.40')), st));
    const r = o.rnd || Math.random;
    return {
      get calibrated() { return calibrated; },
      show(trueph) { const v = trueph + (calibrated ? 0 : (o.offset ?? 0.3)) + VL.gauss(r) * 0.01; disp.textContent = fmt(v, 2); return Math.round(v * 100) / 100; }
    };
  };

  VL.table = function (cols, rows, o) {
    o = o || {};
    return h('div', { class: 'tw' }, h('table', { class: 'obs' }, h('thead', {}, h('tr', {}, cols.map(c => h('th', { html: c })))), h('tbody', {}, rows.map((r, i) => h('tr', { class: (o.hl && o.hl(i, r)) ? 'hl' : null }, r.map((c, j) => h('td', { class: j ? 'num' : null }, c)))))));
  };

  /* Student calculation check. o:{label, expected:()=>number|null, tol (relative, default .05), abs, unit, working:html} */
  VL.check = function (o) {
    const inp = h('input', { class: 'inp', type: 'number', step: 'any', 'aria-label': o.label });
    const fb = h('div', { class: 'msg', 'aria-live': 'polite' });
    const work = h('div', { class: 'eq', hidden: true, html: o.working || '' });
    const go = () => {
      const exp = o.expected(); if (exp == null || !isFinite(exp)) { fb.className = 'msg warn'; fb.textContent = 'Record all the readings first.'; return; }
      const v = parseFloat(inp.value); if (!isFinite(v)) { fb.className = 'msg warn'; fb.textContent = 'Enter your calculated value.'; return; }
      const err = o.abs != null ? Math.abs(v - exp) : Math.abs(v - exp) / Math.abs(exp), lim = o.abs != null ? o.abs : (o.tol ?? 0.05);
      if (err <= lim) { fb.className = 'msg ok'; fb.textContent = `Correct. Expected about ${VL.sig(exp, 4)} ${o.unit || ''}.`; o.onPass && o.onPass(); }
      else { fb.className = 'msg bad'; fb.textContent = `Not matching your readings. Check units and the formula, then try again.`; }
    };
    return h('div', {}, h('div', { class: 'checkrow' }, h('label', {}, o.label, inp), h('span', { class: 'muted' }, o.unit || ''), h('button', { class: 'btn', onclick: go }, 'Check'), h('button', { class: 'btn', onclick: () => { work.hidden = !work.hidden; } }, 'Show working')), fb, work);
  };

  VL.viva = function (sets) {
    return h('div', { class: 'cols' }, Object.keys(sets).map(k => h('div', { class: 'card' }, h('h3', {}, 'Set ' + k), sets[k].map(([q, a], i) => h('details', { class: 'q' }, h('summary', {}, `${i + 1}. ${q}`), h('div', {}, a))))));
  };
})();

/* ===== Virtual Lab shell: hub, tabs, report, routing ===== */
(() => {
  const { h, store } = VL;
  const app = document.getElementById('app');
  const student = Object.assign({ name: '', roll: '', batch: '' }, store.get('student', {}));
  const doneSet = new Set(store.get('done', []));
  let theme = store.get('theme', null);
  const applyTheme = () => { if (theme) document.documentElement.setAttribute('data-theme', theme); else document.documentElement.removeAttribute('data-theme'); };
  applyTheme();

  function topBar(back) {
    return h('div', { class: 'bar' },
      back ? h('a', { href: '#', class: 'btn small', onclick: e => { e.preventDefault(); go(''); } }, '← All experiments') : null,
      h('div', { class: 'brand' }, 'Virtual Pharmacy Lab ', h('span', {}, '· BP306P')),
      h('button', { class: 'btn small', 'aria-label': 'Switch light and dark theme', onclick: () => {
        const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        theme = dark ? 'light' : 'dark'; store.set('theme', theme); applyTheme(); } }, 'Light / Dark'));
  }

  function hub() {
    const inp = (id, label, key, ph) => h('label', { for: id }, label, h('input', { id, value: student[key], placeholder: ph, oninput: e => { student[key] = e.target.value; store.set('student', student); } }));
    const rows = VL.experiments.slice().sort((a, b) => a.no - b.no).map(e => h('a', { class: 'row', href: '#exp' + e.no, onclick: ev => { ev.preventDefault(); go('exp' + e.no); } },
      h('div', { class: 'no' }, String(e.no).padStart(2, '0')),
      h('div', {}, h('div', { class: 'ttl' }, e.title), h('div', { class: 'sub' }, e.sub), h('div', {}, e.topic.map(t => h('span', { class: 'chip' }, t)), doneSet.has(e.id) ? h('span', { class: 'chip done' }, 'Completed') : null)),
      h('div', { class: 'go' }, 'Open lab →')));
    app.replaceChildren(h('div', { class: 'wrap' }, topBar(false),
      h('div', { class: 'hero' }, h('div', { class: 'code' }, 'B.Pharm · Semester III · Physical Pharmaceutics I'), h('h1', {}, 'Virtual practical lab'),
        h('p', {}, 'Eleven experiments from the practical manual. Prepare the apparatus, run the titration or measurement, record readings, plot the graph, calculate the result and answer the viva questions. Every student gets slightly different readings, so results cannot be copied.')),
      h('div', { class: 'credit' }, h('span', { class: 'lbl' }, 'Prepared by'), h('div', {}, h('b', {}, 'Mr. Ashish V. Jivrakh'), ', Assistant Professor', h('br'), 'Department of Pharmaceutics', h('br'), 'Shreeyash Institute of Pharmaceutical Education & Research (SYIPER)')),
      h('div', { class: 'credit' }, h('span', { class: 'lbl' }, 'Subject in-charge'), h('div', {}, h('b', {}, 'Mr. Ashish V. Jivrakh'), h('br'), h('b', {}, 'Mr. Vinayk Mhaismale'))),
      h('div', { class: 'student' }, inp('s-name', 'Student name', 'name', 'Your name'), inp('s-roll', 'Roll number', 'roll', 'e.g. 23'), inp('s-batch', 'Batch / division', 'batch', 'e.g. B1')),
      h('div', { class: 'index', role: 'list' }, rows)));
  }

  function experiment(e) {
    const seed = VL.hash((student.name || 'guest') + '|' + (student.roll || '0') + '|' + e.id);
    const rnd = VL.mulberry(seed);
    const bench = h('div', { class: 'bench' }), results = h('div', { class: 'panel', style: { padding: 0 } });
    const ctx = { seed, rnd, bench, results, student, data: {}, render: () => {}, reportFn: () => ({}), refresh() { if (tab === 'results') this.render(); }, done() { if (!doneSet.has(e.id)) { doneSet.add(e.id); store.set('done', [...doneSet]); VL.toast('Experiment marked complete'); } }, noise: sd => VL.gauss(rnd) * sd };
    let tab = location.hash.split('-')[1] || 'overview';
    const tabs = [['overview', 'Aim & theory'], ['bench', 'Virtual bench'], ['results', 'Results'], ['viva', 'Viva'], ['report', 'Report']];
    const panelHost = h('div', { class: 'panel' });
    const tabBar = h('div', { class: 'tabs', role: 'tablist' });
    e.build(ctx);
    const overview = () => h('div', { class: 'panel', style: { padding: 0 } },
      h('div', { class: 'card' }, h('h3', {}, 'Introduction and principle'), h('div', { html: e.theory })),
      h('div', { class: 'cols' }, h('div', { class: 'card' }, h('h3', {}, 'Chemicals'), h('ul', { class: 'plain' }, e.chemicals.map(c => h('li', {}, c)))), h('div', { class: 'card' }, h('h3', {}, 'Apparatus'), h('ul', { class: 'plain' }, e.apparatus.map(c => h('li', {}, c))))),
      h('div', { class: 'card' }, h('h3', {}, 'Procedure'), h('ol', { class: 'steps' }, e.steps.map(s => h('li', { html: s })))),
      e.reference ? h('p', { class: 'muted' }, 'Reference: ' + e.reference) : null,
      h('div', {}, h('button', { class: 'btn primary', onclick: () => show('bench') }, 'Go to the virtual bench')));
    function show(t) {

      tabBar.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
      if (t === 'overview') panelHost.replaceChildren(overview());
      else if (t === 'bench') panelHost.replaceChildren(bench);
      else if (t === 'results') { ctx.render(); panelHost.replaceChildren(h('div', { class: 'toolbar' }, h('span', { class: 'muted' }, 'Save your table, graphs and result as a PDF'), pdfButton('Download results as PDF')), results); }
      else if (t === 'viva') panelHost.replaceChildren(VL.viva(e.viva));
      else panelHost.replaceChildren(report());
      window.scrollTo({ top: 0 });
    }
    function paperEl() {
      const r = ctx.reportFn() || {};
      const sec = (t, c) => c ? [h('h3', {}, t), typeof c === 'string' ? h('div', { html: c }) : c] : [];
      return h('div', { class: 'paper', id: 'paper' },
        h('h2', {}, `Experiment No. ${e.no}`), h('p', { class: 'ptitle' }, e.title),
        h('div', { class: 'meta' }, h('span', {}, 'Name: ' + (student.name || '__________')), h('span', {}, 'Roll no: ' + (student.roll || '____')), h('span', {}, 'Batch: ' + (student.batch || '____')), h('span', {}, 'Date: ' + new Date().toLocaleDateString('en-GB'))),
        h('p', {}, h('b', {}, 'Aim: '), e.aim),
        sec('Requirements', h('p', {}, h('b', {}, 'Chemicals: '), e.chemicals.join('; ') + '. ', h('b', {}, 'Apparatus: '), e.apparatus.join('; ') + '.')),
        sec('Procedure', h('ol', {}, e.steps.map(s => h('li', { html: s })))),
        sec('Observations', r.obs), sec('Calculation', r.calc), sec('Result and conclusion', r.result || h('p', {}, 'Complete the bench work to generate the result.')),
        h('p', { style: { marginTop: '28px' } }, 'Teacher\u2019s sign: ______________'));
    }
    const safe = x => String(x || '').trim().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
    function pdfButton(label) {
      const b = h('button', { class: 'btn primary' }, label);
      b.addEventListener('click', async () => {
        b.disabled = true; const t0 = b.textContent; b.textContent = 'Preparing PDF\u2026';
        try {
          ctx.render();
          const name = ['Experiment', String(e.no).padStart(2, '0'), safe(student.name) || 'Student', student.roll ? 'Roll' + safe(student.roll) : ''].filter(Boolean).join('_') + '.pdf';
          await VL.makePdf({ paper: paperEl(), results: ctx.results, filename: name, footer: `Virtual Pharmacy Lab \u00b7 BP306P \u00b7 Experiment ${e.no} \u00b7 ${student.name || 'Student'}${student.roll ? ' (Roll ' + student.roll + ')' : ''}`, credit: 'Virtual lab prepared by Mr. Ashish V. Jivrakh, Department of Pharmaceutics, SYIPER' });
          VL.toast('PDF saved. Check your Downloads folder.');
        } catch (err) { console.error(err); VL.toast('Could not create the PDF in this browser. Try Chrome or Safari.'); }
        b.disabled = false; b.textContent = t0;
      });
      return b;
    }
    function report() {
      const paper = paperEl();
      return h('div', { class: 'panel', style: { padding: 0 } }, h('div', { class: 'tip' }, 'This report fills in from your own readings. Download it as an A4 PDF (with your graphs) to submit or print.'), h('div', {}, pdfButton('Download report as PDF')), paper);
    }
    tabs.forEach(([k, label]) => tabBar.append(h('button', { class: 'tab', role: 'tab', 'data-t': k, onclick: () => show(k) }, label)));
    app.replaceChildren(h('div', { class: 'wrap' }, topBar(true), h('div', { class: 'exp-head' }, h('div', { class: 'crumb muted mono' }, `Experiment ${e.no} of 11`), h('h1', {}, e.title), h('div', { class: 'aim' }, e.aim)), tabBar, panelHost));
    show(tab);
  }

  function go(r) { location.hash = r ? '#' + r : ''; route(); }
  function route() {
    const m = /^#exp(\d+)/.exec(location.hash);
    const e = m && VL.experiments.find(x => x.no === +m[1]);
    if (e) experiment(e); else hub();
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', () => { if (!/-/.test(location.hash) || !/^#exp/.test(location.hash)) route(); });
  VL.start = route;
})();

/* ===== Virtual Lab PDF export: draws the report on A4 canvases and writes a PDF (no libraries) ===== */
(() => {
  const { h } = VL;
  const PW = 1240, PH = 1754, M = 96, CW = PW - 2 * M, BOTTOM = PH - M - 30;
  const SERIF = 'Georgia, "Times New Roman", serif', SANS = '"Source Sans 3", Arial, Helvetica, sans-serif', MONO = '"JetBrains Mono", Menlo, Consolas, "Courier New", monospace';
  const INLINE = new Set(['B', 'STRONG', 'I', 'EM', 'SUB', 'SUP', 'SPAN', 'A', 'SMALL', 'BR', 'U']);
  const P = { pages: [], g: null, y: 0 };

  function newPage() {
    const c = document.createElement('canvas'); c.width = PW; c.height = PH;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, PW, PH); g.textBaseline = 'alphabetic';
    P.pages.push(c); P.g = g; P.y = M;
  }
  const need = hgt => { if (P.y + hgt > BOTTOM) newPage(); };
  const fontStr = (st, size, fam) => `${st.i ? 'italic ' : ''}${st.b ? 'bold ' : ''}${Math.max(8, Math.round(size * (st.scale || 1)))}px ${fam}`;

  function tokens(node, st, o, upper) {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) {
        const re = /\S+|\s+/g; let m;
        while ((m = re.exec(n.textContent))) { if (/^\s/.test(m[0])) o.pending = true; else { o.toks.push({ t: upper ? m[0].toUpperCase() : m[0], st, space: o.pending }); o.pending = false; } }
      } else if (n.nodeType === 1) {
        const tag = n.tagName;
        if (tag === 'BR') { o.toks.push({ br: true }); o.pending = false; return; }
        if (tag === 'SVG' || tag === 'svg' || tag === 'SCRIPT' || tag === 'STYLE') return;
        let s2 = st;
        if (tag === 'B' || tag === 'STRONG') s2 = { ...st, b: true };
        else if (tag === 'I' || tag === 'EM') s2 = { ...st, i: true };
        else if (tag === 'SUB') s2 = { ...st, shift: 0.22, scale: 0.7 };
        else if (tag === 'SUP') s2 = { ...st, shift: -0.38, scale: 0.7 };
        tokens(n, s2, o, upper);
      }
    });
  }
  const runsOf = (el, st, upper) => { const o = { toks: [], pending: false }; tokens(el, st || {}, o, upper); return o.toks; };

  function wrap(toks, size, fam, maxW) {
    const g = P.g, lines = []; let cur = { items: [], w: 0 };
    g.font = fontStr({}, size, fam); const spW = g.measureText(' ').width;
    for (const tk of toks) {
      if (tk.br) { lines.push(cur); cur = { items: [], w: 0 }; continue; }
      g.font = fontStr(tk.st, size, fam); const w = g.measureText(tk.t).width;
      if (cur.items.length && tk.space && cur.w + spW + w > maxW) { lines.push(cur); cur = { items: [], w: 0 }; }
      const gp = tk.space && cur.items.length ? spW : 0;
      cur.items.push({ t: tk.t, st: tk.st, x: cur.w + gp, w }); cur.w += gp + w;
    }
    lines.push(cur);
    while (lines.length > 1 && !lines[lines.length - 1].items.length) lines.pop();
    return lines;
  }
  function drawLine(line, x, base, size, fam, align, width, color) {
    const g = P.g; let ox = x; if (align === 'center') ox = x + (width - line.w) / 2; else if (align === 'right') ox = x + width - line.w;
    g.fillStyle = color || '#111';
    line.items.forEach(it => { g.font = fontStr(it.st, size, fam); g.fillText(it.t, ox + it.x, base + (it.st.shift || 0) * size); });
  }
  /* Draws a block of text. o: {x,w,size,fam,align,color,bg,lh,gap} */
  function para(toks, o) {
    o = Object.assign({ x: M, w: CW, size: 25, fam: SERIF, align: 'left', lh: 1.42, gap: 12, pad: 0 }, o);
    P.g.font = fontStr({}, o.size, o.fam);
    const lines = wrap(toks, o.size, o.fam, o.w - 2 * o.pad), lh = o.size * o.lh;
    if (o.bg) {
      need(Math.min(lines.length * lh + 2 * o.pad, 400));
      if (P.y + lines.length * lh + 2 * o.pad > BOTTOM) newPage();
      P.g.fillStyle = o.bg; P.g.fillRect(o.x, P.y, o.w, lines.length * lh + 2 * o.pad); P.y += o.pad;
    }
    lines.forEach(l => { need(lh); drawLine(l, o.x + o.pad, P.y + o.size * 1.05, o.size, o.fam, o.align, o.w - 2 * o.pad, o.color); if (o.under && l.items.length) { P.g.fillRect(o.x + o.pad, P.y + o.size * 1.05 + 5, l.w, 1.5); } P.y += lh; });
    if (o.bg) P.y += o.pad;
    P.y += o.gap;
    return lines;
  }

  function table(tbl) {
    const rows = [...tbl.rows].map(r => [...r.cells].map((c, j) => ({ toks: runsOf(c, { b: c.tagName === 'TH' }), th: c.tagName === 'TH', j })));
    if (!rows.length) return;

/* Shared builder for the two distribution (partition coefficient) experiments */
VL.partitionBuild = function (cfg) {
  return function (ctx) {
    const { h, fmt } = VL;
    const tune = 1 + ctx.noise(0.015);
    const sets = ctx.data.sets = cfg.sets.map((s, i) => {
      const Vs = s.stock, Vo = s.stock + s.extra, Va = s.water, C0 = cfg.C0;
      const total = C0 * Vs;
      const K = cfg.K * tune;
      const Corg = VL.bisect(c => c * Vo + cfg.caq(c, K) * Va - total, 0, total / Vo);
      return { i, ...s, Vo, Va, Corg: Corg * (1 + ctx.noise(0.006)), Caq: cfg.caq(Corg, K) * (1 + ctx.noise(0.008)), stage: 0, Vorg: null, Vaq: null, aq: cfg.aqChoices[0] };
    });
    let cur = 0, mode = null;
    const msg = h('div', { class: 'msg' }), setSeg = h('div', { class: 'seg' }), stepBox = h('div', { class: 'stepper' });
    const tit = VL.titration(ctx.bench, { title: 'Titration', onRecord: v => { const s = sets[cur]; if (mode === 'org') { s.Vorg = v; } else { s.Vaq = v; } mode = null; msg.className = 'msg ok'; msg.textContent = 'Reading stored. See the Results tab.'; paint(); ctx.refresh(); if (sets.every(x => x.Vorg != null && x.Vaq != null)) ctx.done(); } });
    function arm(which) {
      const s = sets[cur]; mode = which;
      if (which === 'org') tit.setup({ end: s.Corg * cfg.orgAliquot / cfg.titOrg.N, titrant: cfg.titOrg.name, sample: `${cfg.orgAliquot} ml ${cfg.orgName} layer${cfg.titOrg.extra ? ' ' + cfg.titOrg.extra : ''}`, indicator: cfg.indicator });
      else tit.setup({ end: s.Caq * s.aq / cfg.titAq.N, titrant: cfg.titAq.name, sample: `${s.aq} ml aqueous layer${cfg.titAq.extra ? ' ' + cfg.titAq.extra : ''}`, indicator: cfg.indicator });
      msg.textContent = '';
    }
    function paint() {
      const s = sets[cur];
      setSeg.replaceChildren(...sets.map(x => h('button', { class: 'btn', 'aria-pressed': String(x.i === cur), onclick: () => { cur = x.i; tit.reset(); paint(); } }, `Set ${x.i + 1}` + (x.Vorg != null && x.Vaq != null ? ' ✓' : ''))));
      const st = (n, txt, label, fn) => h('div', { class: 'step' + (s.stage > n ? ' done' : '') }, h('div', { class: 't', html: txt }), h('button', { class: 'btn small', disabled: s.stage !== n, onclick: fn }, label));
      const adv = (m) => () => { s.stage++; msg.className = 'msg'; msg.textContent = m || ''; paint(); };
      const aqSel = h('select', { class: 'inp', 'aria-label': 'Aqueous aliquot (ml)', disabled: s.stage < 4, onchange: e => { s.aq = +e.target.value; } }, cfg.aqChoices.map(v => h('option', { value: v, selected: v === s.aq }, v + ' ml')));
      stepBox.replaceChildren(
        st(0, `Into a separating funnel put <b>${s.water} ml water</b> + <b>${s.stock} ml</b> ${cfg.stockName}` + (s.extra ? ` + <b>${s.extra} ml</b> ${cfg.orgName}` : ''), 'Prepare mixture', adv('Mixture prepared in the funnel.')),
        st(1, 'Shake vigorously for 30 minutes to reach distribution equilibrium (shown at 60× speed)', 'Shake 30 min', () => { s.stage++; msg.textContent = 'Shaken for 30 minutes.'; paint(); }),
        st(2, 'Stand for 10 minutes with the stopper removed until two clear layers form', 'Let stand 10 min', adv('Two clear layers: ' + cfg.layerNote)),
        st(3, cfg.drainText || 'Drain the lower aqueous layer into a dry stoppered bottle. Discard the interface; the organic layer stays in the funnel.', 'Separate layers', adv('Layers separated.')),
        h('div', { class: 'step' }, h('div', { class: 't' }, `Choose the aqueous aliquot. A larger aliquot gives a bigger titre and a better reading.`), aqSel),
        h('div', { class: 'step' }, h('div', { class: 't' }, 'Pipette an aliquot of each layer and titrate'), h('div', { class: 'seg' },
          h('button', { class: 'btn small', disabled: s.stage < 4, onclick: () => arm('org') }, 'Titrate organic layer' + (s.Vorg != null ? ' ✓' : '')),
          h('button', { class: 'btn small', disabled: s.stage < 4, onclick: () => arm('aq') }, 'Titrate aqueous layer' + (s.Vaq != null ? ' ✓' : '')))));
    }
    ctx.bench.prepend(h('div', { class: 'card' }, h('h3', {}, 'Separating funnels'), h('p', { class: 'muted' }, cfg.benchNote), setSeg, h('div', { style: { height: '10px' } }), stepBox, msg));
    paint();

    const calc = () => sets.filter(s => s.Vorg != null && s.Vaq != null).map(s => {
      const Norg = cfg.titOrg.N * s.Vorg / cfg.orgAliquot, Naq = cfg.titAq.N * s.Vaq / s.aq;
      return { s, Norg, Naq, K: cfg.kOf(Norg, Naq), lo: Math.log10(Norg), la: Math.log10(Naq) };
    });
    const fit = rows => VL.linfit(rows.map(r => [r.lo, r.la]));
    ctx.render = () => {

      const f = rows.length >= 2 ? fit(rows) : null, Km = rows.length ? rows.reduce((a, r) => a + r.K, 0) / rows.length : null;
      const out = f ? cfg.interpret(f, Km) : null;
      ctx.results.replaceChildren(
        h('div', { class: 'card' }, h('h3', {}, 'Observation table'), rows.length ? VL.table(['Set', cfg.vOrgHead, cfg.vAqHead, 'N<sub>org</sub> = C<sub>org</sub>', 'N<sub>aq</sub> = C<sub>aq</sub>', cfg.kHead, 'log C<sub>org</sub>', 'log C<sub>aq</sub>'], rows.map(r => [r.s.i + 1 + '', fmt(r.s.Vorg, 2), fmt(r.s.Vaq, 2) + ` (${r.s.aq} ml)`, fmt(r.Norg, 4), fmt(r.Naq, 5), fmt(r.K, 2), fmt(r.lo, 3), fmt(r.la, 3)])) : h('p', { class: 'muted' }, 'Titrate both layers of at least two sets on the bench.'), Km ? h('p', {}, h('b', {}, 'Mean K = '), fmt(Km, 2)) : null),
        h('div', { class: 'card' }, h('h3', {}, 'log C(aq) against log C(org)'), g, out ? h('p', {}, `Slope = ${fmt(f.m, 3)}, intercept = ${fmt(f.c, 3)}, r² = ${fmt(f.r2, 4)}. `, out.text) : null),
        h('div', { class: 'card' }, h('h3', {}, 'Check your calculation'), h('p', { class: 'muted' }, cfg.calcHint),
          VL.check({ label: 'Mean partition coefficient K', tol: 0.05, expected: () => Km, working: cfg.working }),
          VL.check({ label: 'Slope of the log–log line', tol: 0, abs: 0.05, expected: () => f && f.m, working: 'Slope = (change in log C<sub>aq</sub>) / (change in log C<sub>org</sub>) between the two end points of the fitted line.' })));
      VL.graph(g, { xlabel: 'log C(org)', ylabel: 'log C(aq)', series: [{ name: 'Sets', pts: rows.map(r => [r.lo, r.la]) }], lines: f ? (() => { const xs = rows.map(r => r.lo), a = Math.min(...xs), b = Math.max(...xs); return [{ name: 'Best fit', pts: [[a, f.m * a + f.c], [b, f.m * b + f.c]], dashed: true }]; })() : [] });
    };
    ctx.reportFn = () => {
      const rows = calc(); if (!rows.length) return {};
      const f = rows.length >= 2 ? fit(rows) : null, Km = rows.reduce((a, r) => a + r.K, 0) / rows.length, out = f ? cfg.interpret(f, Km) : null;
      return { obs: VL.table(['Set', 'V org (ml)', 'V aq (ml)', 'N org', 'N aq', cfg.kHead, 'log Corg', 'log Caq'], rows.map(r => [r.s.i + 1 + '', fmt(r.s.Vorg, 2), fmt(r.s.Vaq, 2), fmt(r.Norg, 4), fmt(r.Naq, 5), fmt(r.K, 2), fmt(r.lo, 3), fmt(r.la, 3)])), calc: `<p>${cfg.working}</p>`, result: `<p>Mean partition coefficient K = ${fmt(Km, 2)}.${f ? ' Graph slope = ' + fmt(f.m, 3) + ', so ' + out.text : ''}</p>` };
    };
  };
};

  viva: {

    B: [['What happens to solubility when temperature increases (for most drugs)?', 'It increases, because dissolution of most solids absorbs heat (endothermic).'], ['What is meant by a saturated solution?', 'A solution holding the maximum solute at that temperature, in equilibrium with undissolved solute.'], ['Which method is generally used for solubility determination?', 'The equilibrium (shake-flask) method, followed by analysis of the clear supernatant.'], ['Why is the solution filtered before analysis?', 'To remove undissolved particles so that only dissolved drug is measured.'], ['How is the concentration of the dissolved drug determined?', 'By titration (as here), or by UV spectrophotometry or HPLC.']]
  },
  build(ctx) {
    const { h, fmt } = VL;
    const labT = Math.round((26 + ctx.noise(1.2)) * 10) / 10;
    const SOL = [[0, .17], [20, .29], [25, .34], [30, .42], [40, .60], [50, .95], [60, 1.20], [70, 1.77], [80, 2.75]];
    const f = ctx.rnd() * 0.06 - 0.03;
    const sol = T => { for (let i = 1; i < SOL.length; i++) if (T <= SOL[i][0]) { const [t0, s0] = SOL[i - 1], [t1, s1] = SOL[i]; return Math.exp(Math.log(s0) + (Math.log(s1) - Math.log(s0)) * (T - t0) / (t1 - t0)) * (1 + f); } return SOL[SOL.length - 1][1]; };
    const runs = ctx.data.runs = {}; const temps = [labT, 40, 50, 60, 70, 80];
    let cur = null, stage = 0;

    const seg = h('div', { class: 'seg' });
    const stepBox = h('div', { class: 'stepper' });

    const T = t => t === labT ? `Room temp (${fmt(labT, 1)} °C)` : `${t} °C`;

    function paint() {

      const v1 = cur === labT ? 5 : 10;
      const st = (n, txt, label, fn) => h('div', { class: 'step' + (stage > n ? ' done' : '') }, h('div', { class: 't' }, txt), h('button', { class: 'btn small', disabled: cur == null || stage !== n, onclick: fn }, label));
      stepBox.replaceChildren(
        st(0, cur === labT ? 'Warm 25 ml water slightly, add excess benzoic acid, stir, then cool to room temperature' : cur == null ? 'Pick a temperature first' : `Heat 25 ml water to ${cur} °C and add excess benzoic acid at once, stirring`, 'Prepare saturated solution', () => { runs[cur] = { T: cur, V1: v1, V2: null }; stage = 1; msg.textContent = 'Saturated solution ready with undissolved solid at the bottom.'; paint(); }),
        st(1, `Withdraw ${v1} ml of clear supernatant into a conical flask${cur === labT ? '' : ' (keep the bath at temperature)'}`, 'Pipette ' + v1 + ' ml', () => { stage = 2; paint(); }),
        st(2, 'Add 2 drops of phenolphthalein and fill the burette with 0.1 N NaOH', 'Set up titration', () => { const S = sol(cur) * (1 + ctx.noise(0.01)); const N1 = S * 10 / 122.12; tit.setup({ end: N1 * v1 / 0.1, titrant: '0.1 N NaOH', sample: `${v1} ml benzoic acid supernatant + phenolphthalein`, indicator: { name: 'colourless to pink', from: 'var(--liquid)', to: '#e0328f' } }); stage = 2.5; paint(); }));
    }
    ctx.bench.prepend(h('div', { class: 'card' }, h('h3', {}, 'Saturated solutions'), h('p', { class: 'muted' }, 'Run the six temperatures in any order.'), seg, h('div', { style: { height: '10px' } }), stepBox, msg));
    paint();

    ctx.render = () => {
      const list = temps.filter(t => runs[t] && runs[t].V2 != null).sort((a, b) => a - b);
      const rows = list.map((t, i) => { const r = runs[t], N = 0.1 * r.V2 / r.V1, S = N * 122.12 * 100 / 1000; r.N = N; r.S = S; return [i + 1 + '', t === labT ? fmt(labT, 1) + ' (RT)' : t, r.V1, fmt(r.V2, 2), fmt(N, 4), fmt(S, 3)]; });
      const gdiv = h('div'); const sel = h('select', { class: 'inp', 'aria-label': 'Temperature to check' }, list.map(t => h('option', { value: t }, T(t))));
      ctx.results.replaceChildren(
        h('div', { class: 'card' }, h('h3', {}, 'Observation table'), list.length ? VL.table(['Sr.', 'Temp (°C)', 'Vol. of BA (ml)', 'NaOH end point (ml)', 'Normality of BA', 'Solubility (g/100 ml)'], rows) : h('p', { class: 'muted' }, 'Record at least one titration on the bench.')),
        h('div', { class: 'card' }, h('h3', {}, 'Solubility against temperature'), gdiv),
        h('div', { class: 'card' }, h('h3', {}, 'Check your calculation'), h('p', {}, 'Pick a run and calculate S = N × 122.12 / 10 with N = 0.1 × V₂ / V₁.'), sel,
          VL.check({ label: 'Solubility (g/100 ml)', unit: 'g/100 ml', tol: 0.03, expected: () => { const r = runs[sel.value]; return r && r.V2 != null ? 0.1 * r.V2 / r.V1 * 122.12 / 10 : null; }, working: 'N = 0.1 × V₂ / V₁<br>S = N × 122.12 × 100 / 1000' })));
      VL.graph(gdiv, { xlabel: 'Temperature (°C)', ylabel: 'Solubility (g/100 ml)', xmin: 0, ymin: 0, series: [{ name: 'Benzoic acid', pts: list.map(t => [t, runs[t].S]), line: true }] });
    };
    ctx.reportFn = () => {
      const list = temps.filter(t => runs[t] && runs[t].V2 != null).sort((a, b) => a - b);
      if (!list.length) return {};
      const rows = list.map((t, i) => { const r = runs[t], N = 0.1 * r.V2 / r.V1; return [i + 1 + '', fmt(t, 1), r.V1, fmt(r.V2, 2), fmt(N, 4), fmt(N * 12.212, 3)]; });
      const rt = runs[labT];
      const S = rt && rt.V2 != null ? 0.1 * rt.V2 / rt.V1 * 12.212 : null;

      return { obs: VL.table(['Sr.', 'Temp (°C)', 'Vol. BA (ml)', 'NaOH (ml)', 'Normality', 'S (g/100 ml)'], rows), calc: '<p>N<sub>BA</sub> = 0.1 × V<sub>NaOH</sub> / V<sub>BA</sub>; S = N × 122.12 / 10 (g/100 ml).</p>', result: `<p>Solubility of benzoic acid in water at room temperature (${fmt(labT, 1)} °C) = ${S ? fmt(S, 3) + ' g/100 ml (' + cls + ')' : 'not recorded'}. Solubility increased steadily with temperature, reaching ${fmt(0.1 * runs[list[list.length - 1]].V2 / runs[list[list.length - 1]].V1 * 12.212, 3)} g/100 ml at ${list[list.length - 1]} °C.</p>` };
    };
  }
});

/* Experiment 2: pKa by half neutralization / Henderson-Hasselbalch */
VL.register({
  id: 'exp2', no: 2, title: 'pKa by half neutralization', sub: 'Acetic acid titrated against NaOH with a pH meter', topic: ['pKa', 'Potentiometry', 'Buffers'],
  aim: 'To determine the pKa of a weak acid (acetic acid) by titrating it against a strong base potentiometrically, using the Henderson–Hasselbalch equation.',
  reference: 'More HN, Hajare AA. Practical Physical Pharmacy, Career Publications, 2010: 224–226.',
  theory: `<p>When acetic acid is titrated with a strong base, a mixture of the acid and its salt forms, and this mixture acts as a buffer. Its pH at any stage follows the Henderson–Hasselbalch equation.</p>
  <div class="eq">pH = pKa + log ([Salt] / [Acid])</div>
  <p>At half neutralization the salt and acid concentrations are equal, so the log term is zero and <b>pH = pKa</b>. The end point is found accurately from the peak of a dpH/dV against V plot, and half of that volume locates the half neutralization point on the pH against V curve.</p>
  <p>pKa = −log Ka. A lower pKa means a stronger acid.</p>`,
  chemicals: ['0.04 N acetic acid', '0.04 N NaOH (standard)', 'Buffer solutions of known pH'],
  apparatus: ['Burette', 'Beakers', 'Stirrer', 'pH meter with electrode'],
  steps: ['Standardize the pH meter with buffer solutions of known pH.', 'Pipette 25 ml of 0.04 N acetic acid into a dry beaker and dip the electrode in. Measure the pH.', 'Add 1 ml of 0.04 N NaOH from the burette, stir, and measure the pH.', 'Continue adding 1 ml at a time until the pH changes suddenly, then use smaller additions, and take at least three more readings beyond the jump.', 'Calculate dpH, dV and dpH/dV. Plot pH against V and dpH/dV against V.', 'Read the end point x from the dpH/dV peak, then read the pH at V = x/2. That pH equals pKa.'],
  viva: {
    A: [['What is the purpose of this experiment?', 'To find the pKa of a weak acid from its titration curve with a strong base.'], ['What is pKa?', 'The negative logarithm of the acid dissociation constant Ka.'], ['What is the relationship between pKa and Ka?', 'pKa = −log Ka, so a larger Ka means a smaller pKa.'], ['What is the pH at the half-neutralization point?', 'It equals the pKa, because [salt] = [acid].'], ['Name the equation used in this experiment.', 'The Henderson–Hasselbalch equation.']],
    B: [['Write the Henderson–Hasselbalch equation.', 'pH = pKa + log([salt]/[acid]).'], ['Which instrument is used to measure pH?', 'A pH meter with a glass electrode.'], ['What is meant by half-neutralization point?', 'The point where half the acid has been converted to its salt, so [salt] = [acid].'], ['Why is pKa determination important?', 'pKa decides ionization at a given pH, which controls solubility, absorption, partitioning and stability of a drug.'], ['What type of acid is suitable for this method?', 'A weak acid (or a weak base), which forms a buffer region during titration.']]
  },
  build(ctx) {
    const { h, fmt } = VL;
    const pKaTrue = 4.76 + ctx.noise(0.01), Ka = Math.pow(10, -pKaTrue), Kw = 1e-14;
    const lab = Math.round((26 + ctx.noise(1)) * 10) / 10;
    const rows = ctx.data.rows = []; let vol = 0;
    const truePH = V => { const Ca = 0.04 * 25 / (25 + V), Cb = 0.04 * V / (25 + V); return VL.bisect(p => { const H = Math.pow(10, -p); return H + Cb - Kw / H - Ca * Ka / (Ka + H); }, 1, 13); };
    const meter = VL.phmeter(ctx.bench, { rnd: ctx.rnd, offset: ctx.rnd() < 0.5 ? 0.31 : -0.24 });
    const msg = h('div', { class: 'msg' }), tot = h('div', { class: 'readout' });
    const dv = h('input', { id: 'dv', class: 'inp', type: 'number', step: '0.1', min: '0.1', value: '1', 'aria-label': 'Volume of NaOH to add (ml)' });
    const upd = () => { tot.innerHTML = `${fmt(vol, 2)}<small> ml NaOH added</small>`; };
    function read(add) {
      if (!meter.calibrated) { msg.className = 'msg bad'; msg.textContent = 'Calibrate the pH meter with two buffers first.'; return; }
      if (add && !(add > 0)) { msg.className = 'msg warn'; msg.textContent = 'Enter a positive volume.'; return; }
      if (!add && rows.length) { msg.className = 'msg warn'; msg.textContent = 'The initial reading is already recorded.'; return; }
      if (vol + (add || 0) > 40) { msg.className = 'msg warn'; msg.textContent = 'Enough NaOH added (40 ml).'; return; }
      vol = Math.round((vol + (add || 0)) * 100) / 100;
      const p = meter.show(truePH(vol)); rows.push({ V: vol, pH: p }); upd();
      msg.className = 'msg ok'; msg.textContent = `V = ${fmt(vol, 2)} ml, pH = ${fmt(p, 2)}`; ctx.refresh();
    }
    const quick = d => h('button', { class: 'btn', onclick: () => read(d) }, `+${d} ml`);
    ctx.bench.append(h('div', { class: 'card' }, h('h3', {}, '25 ml of 0.04 N acetic acid in the beaker'), h('p', { class: 'muted' }, `Room temperature ${fmt(lab, 1)} °C. Use 1 ml steps first, then 0.1 to 0.2 ml near the sudden jump (around 25 ml).`), tot,
      h('div', { class: 'seg' }, h('button', { class: 'btn', onclick: () => read(0) }, 'Measure starting pH'), quick(1), quick(0.5), quick(0.2), quick(0.1)),
      h('div', { class: 'row-inputs', style: { marginTop: '10px' } }, h('label', { for: 'dv' }, 'Custom volume (ml)', dv), h('button', { class: 'btn', onclick: () => read(parseFloat(dv.value)) }, 'Add NaOH and read pH'), h('button', { class: 'btn', onclick: () => { rows.length = 0; vol = 0; upd(); msg.textContent = 'Started again with a fresh beaker.'; ctx.refresh(); } }, 'New beaker')), msg));
    upd();

    function analyse() {
      const r = rows, d = [];
      for (let i = 1; i < r.length; i++) { const dV = r[i].V - r[i - 1].V, dp = r[i].pH - r[i - 1].pH; d.push({ mid: (r[i].V + r[i - 1].V) / 2, dV, dp, s: dp / dV }); }
      if (d.length < 5) return { d };
      let k = 0; d.forEach((x, i) => { if (x.s > d[k].s) k = i; });
      let Ve = d[k].mid;
      if (k > 0 && k < d.length - 1) { const [a, b, c] = [d[k - 1], d[k], d[k + 1]]; const den = (a.mid - b.mid) * (a.mid - c.mid) * (b.mid - c.mid); const A = (c.mid * (b.s - a.s) + b.mid * (a.s - c.s) + a.mid * (c.s - b.s)) / den, B = (c.mid * c.mid * (a.s - b.s) + b.mid * b.mid * (c.s - a.s) + a.mid * a.mid * (b.s - c.s)) / den; if (A < 0) { const vx = -B / (2 * A); if (Math.abs(vx - b.mid) < Math.max(a.dV, b.dV, c.dV)) Ve = vx; } }
      const Vh = Ve / 2; let pKa = null;
      for (let i = 1; i < r.length; i++) if (r[i - 1].V <= Vh && r[i].V >= Vh) pKa = r[i - 1].pH + (r[i].pH - r[i - 1].pH) * (Vh - r[i - 1].V) / (r[i].V - r[i - 1].V);
      const hh = r.filter(x => x.V > 0.1 * Ve && x.V < 0.9 * Ve).map(x => x.pH - Math.log10(x.V / (Ve - x.V)));
      return { d, Ve, Vh, pKa, hh, hhMean: hh.length ? hh.reduce((a, b) => a + b) / hh.length : null };
    }
    ctx.render = () => {
      const a = analyse(), r = rows;
      const g1 = h('div'), g2 = h('div');
      const trows = r.map((x, i) => i ? [fmt(x.V, 2), fmt(x.pH, 2), fmt(a.d[i - 1].dp, 2), fmt(a.d[i - 1].dV, 2), fmt(a.d[i - 1].s, 3)] : [fmt(x.V, 2), fmt(x.pH, 2), '', '', '']);
      ctx.results.replaceChildren(
        h('div', { class: 'card' }, h('h3', {}, `Observation table (room temperature ${fmt(lab, 1)} °C)`), r.length ? VL.table(['V of 0.04 N NaOH (ml)', 'pH', 'dpH', 'dV', 'dpH/dV'], trows) : h('p', { class: 'muted' }, 'Take readings on the bench first.')),
        h('div', { class: 'cols' }, h('div', { class: 'card' }, h('h3', {}, 'pH against volume'), g1), h('div', { class: 'card' }, h('h3', {}, 'dpH/dV against volume (end point)'), g2)),
        h('div', { class: 'card' }, h('h3', {}, 'Result'), a.Ve ? h('div', {}, h('p', {}, `End point from the dpH/dV peak: ${fmt(a.Ve, 2)} ml. Half-neutralization volume: ${fmt(a.Vh, 2)} ml.`), a.pKa != null ? h('p', {}, `pH at half neutralization = pKa = ${fmt(a.pKa, 2)}; Ka = ${(Math.pow(10, -a.pKa)).toExponential(2)}.`) : h('p', { class: 'warn' }, 'No reading brackets the half-neutralization volume. Add readings around it.'), a.hhMean != null ? h('p', { class: 'muted' }, `Henderson–Hasselbalch check on buffer-region readings: mean pKa = ${fmt(a.hhMean, 2)} from ${a.hh.length} points.`) : null,
          VL.check({ label: 'Your pKa', tol: 0, abs: 0.06, unit: '', expected: () => a.pKa, working: 'Find x at the dpH/dV peak, read the pH at V = x/2 on the pH curve. pH = pKa.' }),
          VL.check({ label: 'Your Ka (e.g. 1.8e-5)', tol: 0.15, expected: () => a.pKa != null ? Math.pow(10, -a.pKa) : null, working: 'Ka = 10<sup>−pKa</sup>' })) : h('p', { class: 'muted' }, 'Record the starting pH, buffer-region points and at least three points beyond the sudden jump.')));
      const pts = r.map(x => [x.V, x.pH]);
      VL.graph(g1, { xlabel: 'Volume of 0.04 N NaOH (ml)', ylabel: 'pH', xmin: 0, ymin: 0, series: [{ name: 'pH', pts, line: true }], marks: a.pKa != null ? [{ x: a.Vh, y: a.pKa, label: `pH = pKa = ${fmt(a.pKa, 2)}` }] : [] });
      VL.graph(g2, { xlabel: 'Volume of NaOH (ml)', ylabel: 'dpH/dV', xmin: 0, ymin: 0, series: [{ name: 'dpH/dV', pts: a.d.map(x => [x.mid, x.s]), line: true, color: 'var(--teal)' }], marks: a.Ve ? [{ x: a.Ve, y: Math.max(...a.d.map(x => x.s)), label: `end point ${fmt(a.Ve, 1)} ml` }] : [] });
      if (a.pKa != null) ctx.done();
    };
    ctx.reportFn = () => { const a = analyse(); if (!rows.length) return {}; const r = rows; return { obs: VL.table(['V NaOH (ml)', 'pH', 'dpH', 'dV', 'dpH/dV'], r.map((x, i) => i ? [fmt(x.V, 2), fmt(x.pH, 2), fmt(a.d[i - 1].dp, 2), fmt(a.d[i - 1].dV, 2), fmt(a.d[i - 1].s, 3)] : [fmt(x.V, 2), fmt(x.pH, 2), '', '', ''])), calc: a.Ve ? `<p>End point (dpH/dV peak) x = ${fmt(a.Ve, 2)} ml; pH read at V = x/2 = ${fmt(a.Vh, 2)} ml gives pH = pKa.</p>` : '', result: a.pKa != null ? `<p>pKa of acetic acid = ${fmt(a.pKa, 2)} at ${fmt(lab, 1)} °C. Ka = ${Math.pow(10, -a.pKa).toExponential(2)}.</p>` : '' }; };
  }
});

/* Experiment 3: Partition coefficient of benzoic acid between benzene and water */
VL.register({
  id: 'exp3', no: 3, title: 'Partition coefficient of benzoic acid', sub: 'Benzene and water, with association to dimers in benzene', topic: ['Partition', 'Distribution law'],

      vOrgHead: 'V<sub>org</sub> (0.1 N NaOH, ml)', vAqHead: 'V<sub>aq</sub> (0.01 N NaOH, ml)', kHead: 'K = C<sub>org</sub><sup>1/2</sup>/C<sub>aq</sub>',
      calcHint: 'N<sub>org</sub> = 0.1 × V₁ / 10, N<sub>aq</sub> = 0.01 × V₃ / aliquot, then K = √N<sub>org</sub> / N<sub>aq</sub>.',

/* Experiment 4: Partition coefficient of iodine between CCl4 and water */

  reference: 'More HN, Hajare AA. Practical Physical Pharmacy, Career Publications, 2010: 86–87.',

  <div class="note">Benzene and toluene are flammable and toxic. Use them only in a fume hood with gloves in a real lab.</div>`,

/* Experiment 7: HLB value of a surfactant (glyceryl monostearate) by saponification */
VL.register({
  id: 'exp7', no: 7, title: 'HLB value of a surfactant', sub: 'Saponification number and acid number (Griffin’s method)', topic: ['Surfactants', 'HLB'],
  aim: 'To determine the HLB value of a given surfactant (glyceryl monostearate) from its saponification number and the acid number of its fatty acid.',
  reference: 'More HN, Hajare AA, 2010: 194–195; Gaud RS, Gupta GD, 2009: 71–72; Mohanta GP, 2006: 36–38.',
  theory: `<p>A surfactant lowers the surface tension of water. The hydrophilic–lipophilic balance (HLB) is an arbitrary 0 to 20 scale of how polar or non-polar a surfactant is. Low HLB means oil soluble (e.g. Span 80, 4.3); high HLB means water soluble (e.g. Tween 20, 16.7). Griffin introduced the scale in 1949 and 1954.</p>

  viva: {

        stp(2, 'Add phenolphthalein and titrate with 0.1 N NaOH', 'Set up titration', () => { next(); tit.setup({ end: A0 * P.acid.w / (56.1 * 0.1), titrant: '0.1 N NaOH', sample: 'stearic acid in alcohol–ether + phenolphthalein', indicator: { name: 'colourless to pink', from: 'var(--liquid)', to: '#e0328f', mode: 'appear' } }); paint(); }));

  }

/* Experiment 8: Freundlich and Langmuir constants, adsorption of acetic acid on charcoal */
VL.register({
  id: 'exp8', no: 8, title: 'Freundlich and Langmuir constants', sub: 'Adsorption of acetic acid on activated charcoal', topic: ['Adsorption', 'Isotherms'],
  aim: 'Determination of Freundlich and Langmuir constants using activated charcoal, and estimation of its monolayer capacity and specific surface area.',
  reference: 'More HN, Hajare AA. Practical Physical Pharmacy, Career Publications, 2010: 57–59.',
  theory: `<p>Adsorption is a surface phenomenon: the adsorbate sticks to the surface of the adsorbent. Two isotherms are used to describe adsorption from solution at constant temperature.</p>
  <div class="eq">Freundlich: x/m = k C<sub>e</sub><sup>1/n</sup>, so log(x/m) = log k + (1/n) log C<sub>e</sub><br>Langmuir: C<sub>e</sub>/(x/m) = 1/(b·y<sub>m</sub>) + C<sub>e</sub>/y<sub>m</sub></div>
  <p>Langmuir assumes active sites on the surface, monolayer adsorption, and dynamic equilibrium between adsorbed and free molecules. y<sub>m</sub> is the monolayer capacity (g of adsorbate per g of adsorbent). The specific surface area follows from y<sub>m</sub>:</p>
  <div class="eq">S = (y<sub>m</sub> / M) × N × A<br>N = 6.022×10<sup>23</sup>, M = 60 (acetic acid), A = cross-section of one acetic acid molecule</div>
  <div class="note">The manual quotes A = 16×10<sup>−16</sup> cm² in the introduction and 18×10<sup>−16</sup> cm² in the calculation. You can change A in the results tab; the lab starts with 18.</div>`,
  chemicals: ['Activated charcoal', '0.5 N acetic acid', '0.2 N NaOH', 'Phenolphthalein', 'Distilled water'],
  apparatus: ['Reagent bottles', 'Burette', 'Pipette', 'Funnels and filter paper', 'Water bath', 'Conical flasks'],
  steps: ['Standardize the acetic acid: titrate 10 ml against 0.2 N NaOH (colourless to pink) to find N<sub>0</sub>.', 'Prepare five dry bottles with acid + water volumes: 50+0, 40+10, 30+20, 20+30, 10+40 ml, so that N<sub>1</sub> = N<sub>0</sub> × 1, 0.8, 0.6, 0.4, 0.2.', 'Add 1 g activated charcoal to each bottle and swirl for 40 minutes at room temperature.', 'Filter through dry filter paper and titrate 10 ml of each filtrate with 0.2 N NaOH to get N<sub>2</sub>.', 'Calculate x = 3(N<sub>1</sub> − N<sub>2</sub>), x/m, C<sub>e</sub> = 60 N<sub>2</sub>, and plot both isotherms.'],
  viva: {
    A: [['What is the purpose of this experiment?', 'To find the Freundlich and Langmuir constants, monolayer capacity and surface area of charcoal from adsorption of acetic acid.'], ['Which adsorbent is used?', 'Activated charcoal.'], ['Name the two adsorption isotherms studied.', 'Freundlich and Langmuir isotherms.'], ['Write the Freundlich isotherm equation.', 'x/m = k C^(1/n).'], ['Write the linear form of Freundlich isotherm.', 'log(x/m) = log k + (1/n) log C.']],
    B: [['Write the Langmuir adsorption isotherm equation.', 'C/(x/m) = 1/(b·ym) + C/ym.'], ['What does x/m represent?', 'Mass of adsorbate adsorbed per unit mass of adsorbent at equilibrium.'], ['What does C represent in adsorption isotherms?', 'The equilibrium concentration of the adsorbate in solution.'], ['Which plot verifies the Freundlich isotherm?', 'log(x/m) against log C, a straight line.'], ['Which plot verifies the Langmuir isotherm?', 'C/(x/m) against C, a straight line with slope 1/ym.']]
  },
  build(ctx) {
    const { h, fmt } = VL;
    const N0 = 0.5 * (1 + ctx.noise(0.01)), ym = 0.20 * (1 + ctx.noise(0.03)), bb = 0.05 * (1 + ctx.noise(0.04));
    const fr = [1, 0.8, 0.6, 0.4, 0.2], water = [0, 10, 20, 30, 40], acid = [50, 40, 30, 20, 10];
    const N2t = i => { const N1 = N0 * fr[i]; return VL.bisect(n => N1 - (ym * bb * 60 * n / (1 + bb * 60 * n)) / 3 - n, 0.0001, N1); };
    const D = ctx.data; D.N0m = null; D.bot = fr.map(() => ({ V: null })); let stage = 0, cur = 0, mode = 'std'; D.A = 18;
    const msg = h('div', { class: 'msg' }), box = h('div', { class: 'stepper' }), bseg = h('div', { class: 'seg' });
    const tit = VL.titration(ctx.bench, { title: 'Titration with 0.2 N NaOH', onRecord: v => { if (mode === 'std') { D.N0m = 0.2 * v / 10; msg.className = 'msg ok'; msg.textContent = `Exact normality of the acid N₀ = 0.2 × ${fmt(v, 2)} / 10 = ${fmt(D.N0m, 4)} N.`; stage = Math.max(stage, 1); } else { D.bot[cur].V = v; msg.className = 'msg ok'; msg.textContent = `Bottle ${cur + 1} stored.`; if (D.bot.every(b => b.V != null)) ctx.done(); } paint(); ctx.refresh(); } });
    function paint() {
      const st = (n, t, l, fn) => h('div', { class: 'step' + (stage > n ? ' done' : '') }, h('div', { class: 't', html: t }), h('button', { class: 'btn small', disabled: stage !== n, onclick: fn }, l));
      bseg.replaceChildren(...fr.map((f, i) => h('button', { class: 'btn', disabled: stage < 4, 'aria-pressed': String(mode === 'bot' && cur === i), onclick: () => { cur = i; mode = 'bot'; tit.setup({ end: N2t(i) * 10 / 0.2, titrant: '0.2 N NaOH', sample: `10 ml filtrate from bottle ${i + 1} + phenolphthalein`, indicator: { name: 'colourless to pink', from: 'var(--liquid)', to: '#e0328f' } }); paint(); } }, `Bottle ${i + 1}` + (D.bot[i].V != null ? ' ✓' : ''))));
      box.replaceChildren(
        st(0, 'Standardize the acid: 10 ml of the given acetic acid with phenolphthalein', 'Set up standardization', () => { mode = 'std'; tit.setup({ end: N0 * 10 / 0.2, titrant: '0.2 N NaOH', sample: '10 ml acetic acid + phenolphthalein', indicator: { name: 'colourless to pink', from: 'var(--liquid)', to: '#e0328f' } }); paint(); }),

      if (stage >= 2) table.replaceChildren(VL.table(['Bottle', 'Water (ml)', 'Acid (ml)', 'N<sub>1</sub> (N)'], fr.map((f, i) => [i + 1, water[i], acid[i], D.N0m ? fmt(D.N0m * f, 4) : '–'])));
    }
    const table = h('div');

    paint();

    const rows = () => D.bot.map((b, i) => { if (b.V == null || !D.N0m) return null; const N1 = D.N0m * fr[i], N2 = 0.2 * b.V / 10, Ce = N2 * 60, x = 3 * (N1 - N2), xm = x / 1; return { i, N1, V: b.V, N2, d: N1 - N2, Ce, x, xm, lc: Math.log10(Ce), lx: xm > 0 ? Math.log10(xm) : NaN, lang: Ce / xm }; }).filter(Boolean).filter(r => r.xm > 0);
    const fits = r => { if (r.length < 3) return null; const f = VL.linfit(r.map(x => [x.lc, x.lx])), l = VL.linfit(r.map(x => [x.Ce, x.lang])); const ymf = 1 / l.m; return { f, l, k: Math.pow(10, f.c), n: 1 / f.m, ym: ymf, b: l.m / l.c }; };

      for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (x[i + 1] - x[i]));

      let i = 0; while (i < n - 2 && pH > x[i + 1]) i++;
      const hh = x[i + 1] - x[i], t = (pH - x[i]) / hh, t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * y[i] + (t3 - 2 * t2 + t) * hh * m[i] + (-2 * t3 + 3 * t2) * y[i + 1] + (t3 - t2) * hh * m[i + 1];
    };

    const at = pH => { if (B.gly.rows.length < 5) return null; const cr = cplx(); if (!cr.length) return null; const Vg = interp(B.gly.rows, pH, true), Vc = interp(cr, pH, false); if (Vg == null || Vc == null) return null; const d = Vc - Vg; if (d <= 0.001) return null; const n = N * d / (CuT * V0), free = (LT * V0 - N * d) / (V0 + Vc); if (free <= 0) return null; return { pH, Vg, Vc, d, n, pA: 9.6 - pH - Math.log10(free) }; };

          VL.check({ label: 'p[A] at the chosen pH', tol: 0, abs: 0.1, expected: () => { const r = at(+sel.value); return r && r.pA; }, working: 'free HA = (3.34×10⁻² × 75 − 0.25 Δ) / (75 + V<sub>complex</sub>)<br>p[A] = 9.6 − pH − log(free HA)' }),
